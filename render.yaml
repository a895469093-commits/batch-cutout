services:
  - type: web
    name: batch-cutout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APIMART_API_KEY
        sync: false   # 在 Render 后台手动填,不进仓库
      - key: CUTOUT_WORKERS
        value: "4"
      - key: CUTOUT_RESOLUTION
        value: "1k"
